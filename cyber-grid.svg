<svg width="100%" height="24" viewBox="0 0 800 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FA9DA" />
      <stop offset="100%" stop-color="#3c4475" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F96BF" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    
    <g id="block">
      <rect x="0" y="8" width="8" height="8" rx="2" fill="url(#grad1)">
         <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="16" y="8" width="8" height="8" rx="2" fill="#3c4475">
         <animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="32" y="8" width="8" height="8" rx="2" fill="url(#grad2)">
         <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="8" width="8" height="8" rx="2" fill="#5868a8">
         <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="64" y="8" width="8" height="8" rx="2" fill="url(#grad1)">
         <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="80" y="8" width="8" height="8" rx="2" fill="#9FA9DA">
         <animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </defs>


  <g opacity="0.05"><use href="#block" x="0" /></g>
  <g opacity="0.2"><use href="#block" x="96" /></g>
  <g opacity="0.5"><use href="#block" x="192" /></g>
  <g opacity="0.8"><use href="#block" x="288" /></g>
  <g opacity="1.0"><use href="#block" x="384" /></g> 
  <g opacity="0.8"><use href="#block" x="480" /></g>
  <g opacity="0.5"><use href="#block" x="576" /></g>
  <g opacity="0.2"><use href="#block" x="672" /></g>
  <g opacity="0.05"><use href="#block" x="768" /></g>
</svg>
