<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 195" width="100%" height="100%" font-family="&#39;Segoe UI&#39;, Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">

  <!-- ================= LEFT: OVERVIEW ================= -->
  <g transform="translate(28, 28)">
    <text x="0" y="0" fill="#9FA9DA" font-size="15" font-weight="700" letter-spacing="0.3">Overview</text>

    <g transform="translate(0, 38)">
      <!-- Commits -->
      <text x="0" y="0" fill="#9FA9DA" font-size="26" font-weight="700">427</text>
      <text x="0" y="21" fill="#8F96BF" font-size="13" font-weight="400">Commits</text>

      <!-- Repositories -->
      <text x="125" y="0" fill="#9FA9DA" font-size="26" font-weight="700">18</text>
      <text x="125" y="21" fill="#8F96BF" font-size="13" font-weight="400">Repositories</text>

      <!-- Pull Requests -->
      <text x="0" y="72" fill="#9FA9DA" font-size="26" font-weight="700">14</text>
      <text x="0" y="93" fill="#8F96BF" font-size="13" font-weight="400">Pull Requests</text>

      <!-- Stars Earned -->
      <text x="125" y="72" fill="#9FA9DA" font-size="26" font-weight="700">26</text>
      <text x="125" y="93" fill="#8F96BF" font-size="13" font-weight="400">Stars Earned</text>
    </g>

    <!-- Bold Solid Ring -->
    <g transform="translate(312, 75)">
      <circle cx="0" cy="0" r="44" fill="none" stroke="#8F96BF" stroke-opacity="0.18" stroke-width="5" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="#9FA9DA" stroke-width="5" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" from="276.5" to="55" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
      </circle>
      <text x="0" y="6" fill="#9FA9DA" font-size="24" font-weight="700" text-anchor="middle">A+</text>
      <text x="0" y="24" fill="#8F96BF" font-size="11" font-weight="600" letter-spacing="0.8" text-anchor="middle">RANK</text>
    </g>
  </g>

  <!-- ================= CENTER DOTTED RAIN DIVIDER ================= -->
  <line x1="425" y1="18" x2="425" y2="178" stroke="#9FA9DA" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 10">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.75s" repeatCount="indefinite" />
  </line>

  <!-- ================= RIGHT: TOP LANGUAGES ================= -->
  <g transform="translate(465, 28)">
    <text x="0" y="0" fill="#9FA9DA" font-size="15" font-weight="700" letter-spacing="0.3">Top Languages</text>

    <!-- Python (46.4% -> 162px) -->
    <g transform="translate(0, 28)">
      <text x="0" y="0" fill="#9FA9DA" font-size="13.5" font-weight="600">Python</text>
      <text x="350" y="0" fill="#8F96BF" font-size="12.5" font-weight="600" text-anchor="end">46.4%</text>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#8F96BF" fill-opacity="0.16" />
      <rect x="0" y="8" width="0" height="6" rx="3" fill="#9FA9DA">
        <animate attributeName="width" from="0" to="162" dur="0.9s" begin="0.05s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
      </rect>
    </g>

    <!-- Kotlin (24.1% -> 84px) -->
    <g transform="translate(0, 62)">
      <text x="0" y="0" fill="#9FA9DA" font-size="13.5" font-weight="600">Kotlin</text>
      <text x="350" y="0" fill="#8F96BF" font-size="12.5" font-weight="600" text-anchor="end">24.1%</text>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#8F96BF" fill-opacity="0.16" />
      <rect x="0" y="8" width="0" height="6" rx="3" fill="#9FA9DA">
        <animate attributeName="width" from="0" to="84" dur="0.9s" begin="0.12s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
      </rect>
    </g>

    <!-- TypeScript (17.8% -> 62px) -->
    <g transform="translate(0, 96)">
      <text x="0" y="0" fill="#9FA9DA" font-size="13.5" font-weight="600">TypeScript</text>
      <text x="350" y="0" fill="#8F96BF" font-size="12.5" font-weight="600" text-anchor="end">17.8%</text>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#8F96BF" fill-opacity="0.16" />
      <rect x="0" y="8" width="0" height="6" rx="3" fill="#9FA9DA">
        <animate attributeName="width" from="0" to="62" dur="0.9s" begin="0.19s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
      </rect>
    </g>

    <!-- C / HTML / CSS (11.7% -> 41px) -->
    <g transform="translate(0, 130)">
      <text x="0" y="0" fill="#9FA9DA" font-size="13.5" font-weight="600">C / HTML / CSS</text>
      <text x="350" y="0" fill="#8F96BF" font-size="12.5" font-weight="600" text-anchor="end">11.7%</text>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#8F96BF" fill-opacity="0.16" />
      <rect x="0" y="8" width="0" height="6" rx="3" fill="#9FA9DA">
        <animate attributeName="width" from="0" to="41" dur="0.9s" begin="0.26s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
      </rect>
    </g>
  </g>
</svg>
