<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 185" width="100%" height="100%" font-family="&#39;Google Sans Flex&#39;, &#39;Google Sans&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif">
  <defs>
    <!-- userSpaceOnUse prevents horizontal gradient collapse -->
    <linearGradient id="m3-line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0">
      <stop offset="0%" stop-color="#8F96BF" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#9FA9DA" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E2E4F3" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="m3-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E4F3" />
      <stop offset="55%" stop-color="#9FA9DA" />
      <stop offset="100%" stop-color="#8F96BF" stop-opacity="0.35" />
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= LEFT: OVERVIEW (MATERIAL TONAL LAYOUT) ================= -->
  <g transform="translate(28, 26)">
    <!-- Minimal Pill Header -->
    <rect x="0" y="-11" width="6" height="6" rx="3" fill="#9FA9DA" opacity="0.9" />
    <text x="14" y="-4" fill="#9FA9DA" font-size="11.5" font-weight="600" letter-spacing="1.2">OVERVIEW</text>

    <!-- Clean 2x2 Editorial Metric Grid -->
    <g transform="translate(0, 28)">
      <!-- Commits -->
      <text x="0" y="0" fill="#8F96BF" font-size="12" opacity="0.8">Commits</text>
      <text x="0" y="24" fill="#E2E4F3" font-size="22" font-weight="500" letter-spacing="-0.5">427</text>

      <!-- Repositories -->
      <text x="115" y="0" fill="#8F96BF" font-size="12" opacity="0.8">Repositories</text>
      <text x="115" y="24" fill="#E2E4F3" font-size="22" font-weight="500" letter-spacing="-0.5">18</text>

      <!-- Pull Requests -->
      <text x="0" y="68" fill="#8F96BF" font-size="12" opacity="0.8">Pull Requests</text>
      <text x="0" y="92" fill="#E2E4F3" font-size="22" font-weight="500" letter-spacing="-0.5">14</text>

      <!-- Stars Earned -->
      <text x="115" y="68" fill="#8F96BF" font-size="12" opacity="0.8">Stars Earned</text>
      <text x="115" y="92" fill="#E2E4F3" font-size="22" font-weight="500" letter-spacing="-0.5">26</text>
    </g>

    <!-- Material Circular Indicator (Draws at 5.5px -> Thins to 3px & Fades) -->
    <g transform="translate(310, 68)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#8F96BF" stroke-opacity="0.14" stroke-width="2.5" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="url(#m3-ring)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" from="263.9" to="58" dur="1.3s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="stroke-width" from="5.5" to="3" begin="1.1s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="opacity" from="1" to="0.78" begin="1.1s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
      </circle>
      <text x="0" y="5" fill="#E2E4F3" font-size="20" font-weight="500" text-anchor="middle" letter-spacing="-0.5">A+</text>
      <text x="0" y="20" fill="#8F96BF" font-size="8.5" font-weight="500" letter-spacing="1.4" opacity="0.65" text-anchor="middle">INDEX</text>
    </g>
  </g>

  <!-- ================= CENTER DIVIDER ================= -->
  <line x1="425" y1="20" x2="425" y2="20" stroke="#8F96BF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round">
    <animate attributeName="y2" from="20" to="165" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
    <animate attributeName="stroke-width" from="3" to="1.5" begin="0.9s" dur="0.8s" fill="freeze" />
    <animate attributeName="stroke-opacity" from="0.45" to="0.22" begin="0.9s" dur="0.8s" fill="freeze" />
  </line>

  <!-- ================= RIGHT: LANGUAGES (6px DRAW -> 3px SETTLE & FADE) ================= -->
  <g transform="translate(468, 26)">
    <rect x="0" y="-11" width="6" height="6" rx="3" fill="#9FA9DA" opacity="0.9" />
    <text x="14" y="-4" fill="#9FA9DA" font-size="11.5" font-weight="600" letter-spacing="1.2">LANGUAGES</text>

    <!-- Python (46.4% -> 162px) -->
    <g transform="translate(0, 24)">
      <text x="0" y="0" fill="#E2E4F3" font-size="12.5" font-weight="400">Python</text>
      <text x="350" y="0" fill="#8F96BF" font-size="11.5" opacity="0.75" text-anchor="end">46.4%</text>
      <!-- Background Track -->
      <rect x="0" y="8.5" width="350" height="3" rx="1.5" fill="#8F96BF" fill-opacity="0.14" />
      <!-- Active Comet Bar (Starts 6px thick, settles to 3px) -->
      <rect x="0" y="7" width="0" height="6" rx="3" fill="url(#m3-line)">
        <animate attributeName="width" from="0" to="162" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="height" from="6" to="3" begin="1.05s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="y" from="7" to="8.5" begin="1.05s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="opacity" from="1" to="0.75" begin="1.05s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
      </rect>
      <!-- Glowing Comet Tip -->
      <circle cy="10" r="3.5" fill="#E2E4F3" filter="url(#softGlow)">
        <animate attributeName="cx" from="0" to="162" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="r" from="3.5" to="1.5" begin="1.05s" dur="0.7s" fill="freeze" />
        <animate attributeName="opacity" from="1" to="0" begin="1.15s" dur="0.6s" fill="freeze" />
      </circle>
    </g>

    <!-- Kotlin (24.1% -> 84px) -->
    <g transform="translate(0, 58)">
      <text x="0" y="0" fill="#E2E4F3" font-size="12.5" font-weight="400">Kotlin</text>
      <text x="350" y="0" fill="#8F96BF" font-size="11.5" opacity="0.75" text-anchor="end">24.1%</text>
      <rect x="0" y="8.5" width="350" height="3" rx="1.5" fill="#8F96BF" fill-opacity="0.14" />
      <rect x="0" y="7" width="0" height="6" rx="3" fill="url(#m3-line)">
        <animate attributeName="width" from="0" to="84" dur="1.1s" begin="0.22s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="height" from="6" to="3" begin="1.17s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="y" from="7" to="8.5" begin="1.17s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="opacity" from="1" to="0.75" begin="1.17s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
      </rect>
      <circle cy="10" r="3.5" fill="#E2E4F3" filter="url(#softGlow)">
        <animate attributeName="cx" from="0" to="84" dur="1.1s" begin="0.22s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="r" from="3.5" to="1.5" begin="1.17s" dur="0.7s" fill="freeze" />
        <animate attributeName="opacity" from="1" to="0" begin="1.27s" dur="0.6s" fill="freeze" />
      </circle>
    </g>

    <!-- TypeScript (17.8% -> 62px) -->
    <g transform="translate(0, 92)">
      <text x="0" y="0" fill="#E2E4F3" font-size="12.5" font-weight="400">TypeScript</text>
      <text x="350" y="0" fill="#8F96BF" font-size="11.5" opacity="0.75" text-anchor="end">17.8%</text>
      <rect x="0" y="8.5" width="350" height="3" rx="1.5" fill="#8F96BF" fill-opacity="0.14" />
      <rect x="0" y="7" width="0" height="6" rx="3" fill="url(#m3-line)">
        <animate attributeName="width" from="0" to="62" dur="1.1s" begin="0.34s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="height" from="6" to="3" begin="1.29s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="y" from="7" to="8.5" begin="1.29s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="opacity" from="1" to="0.75" begin="1.29s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
      </rect>
      <circle cy="10" r="3.5" fill="#E2E4F3" filter="url(#softGlow)">
        <animate attributeName="cx" from="0" to="62" dur="1.1s" begin="0.34s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="r" from="3.5" to="1.5" begin="1.29s" dur="0.7s" fill="freeze" />
        <animate attributeName="opacity" from="1" to="0" begin="1.39s" dur="0.6s" fill="freeze" />
      </circle>
    </g>

    <!-- C / HTML / CSS (11.7% -> 41px) -->
    <g transform="translate(0, 126)">
      <text x="0" y="0" fill="#E2E4F3" font-size="12.5" font-weight="400">C / HTML / CSS</text>
      <text x="350" y="0" fill="#8F96BF" font-size="11.5" opacity="0.75" text-anchor="end">11.7%</text>
      <rect x="0" y="8.5" width="350" height="3" rx="1.5" fill="#8F96BF" fill-opacity="0.14" />
      <rect x="0" y="7" width="0" height="6" rx="3" fill="url(#m3-line)">
        <animate attributeName="width" from="0" to="41" dur="1.1s" begin="0.46s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="height" from="6" to="3" begin="1.41s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="y" from="7" to="8.5" begin="1.41s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="opacity" from="1" to="0.75" begin="1.41s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
      </rect>
      <circle cy="10" r="3.5" fill="#E2E4F3" filter="url(#softGlow)">
        <animate attributeName="cx" from="0" to="41" dur="1.1s" begin="0.46s" fill="freeze" calcMode="spline" keySplines="0.2, 0, 0, 1" />
        <animate attributeName="r" from="3.5" to="1.5" begin="1.41s" dur="0.7s" fill="freeze" />
        <animate attributeName="opacity" from="1" to="0" begin="1.51s" dur="0.6s" fill="freeze" />
      </circle>
    </g>
  </g>
</svg>
