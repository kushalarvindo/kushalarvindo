<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%">
  <defs>
    <style>
      .bg-card {
        fill: #0d1117;
        fill-opacity: 0.55;
        stroke: #9FA9DA;
        stroke-opacity: 0.22;
        stroke-width: 1;
      }
      .accent-corner {
        fill: none;
        stroke: #9FA9DA;
        stroke-width: 1.8;
        stroke-opacity: 0.75;
      }
      .title {
        font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #9FA9DA;
        letter-spacing: 2px;
      }
      .label {
        font-family: 'Fira Code', 'Segoe UI', monospace;
        font-size: 12px;
        fill: #8F96BF;
      }
      .value {
        font-family: 'Fira Code', 'Segoe UI', monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #E2E8F0;
      }
      .sub-text {
        font-family: 'Fira Code', monospace;
        font-size: 10px;
        fill: #8F96BF;
        opacity: 0.65;
      }
      .bar-bg {
        fill: #161b22;
        rx: 3px;
      }
      .pulse {
        animation: pulse-anim 2.5s infinite ease-in-out;
      }
      .glow-ring {
        animation: rotate-ring 12s linear infinite;
        transform-origin: 345px 128px;
      }
      @keyframes pulse-anim {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes rotate-ring {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>

    <linearGradient id="langGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9FA9DA" />
      <stop offset="100%" stop-color="#5E6AD2" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= LEFT CARD: SYSTEM TELEMETRY ================= -->
  <g transform="translate(10, 10)">
    <rect class="bg-card" width="405" height="210" rx="10" />
    
    <!-- Cyber HUD Corners -->
    <path class="accent-corner" d="M 0 18 L 0 6 A 6 6 0 0 1 6 0 L 18 0" />
    <path class="accent-corner" d="M 387 0 L 399 0 A 6 6 0 0 1 405 6 L 405 18" />
    <path class="accent-corner" d="M 0 192 L 0 204 A 6 6 0 0 0 6 210 L 18 210" />
    <path class="accent-corner" d="M 387 210 L 399 210 A 6 6 0 0 0 405 204 L 405 192" />

    <!-- Card Header -->
    <circle cx="26" cy="28" r="4" fill="#9FA9DA" class="pulse" filter="url(#softGlow)" />
    <text x="40" y="32" class="title">SYSTEM.TELEMETRY</text>
    <text x="345" y="31" class="sub-text">v2.6 // OK</text>
    <line x1="20" y1="46" x2="385" y2="46" stroke="#9FA9DA" stroke-opacity="0.15" />

    <!-- Stat Rows -->
    <g transform="translate(24, 74)">
      <text x="0" y="0" class="label">◈ Total Commits</text>
      <text x="215" y="0" class="value" text-anchor="end">427</text>

      <text x="0" y="30" class="label">◈ Active Repositories</text>
      <text x="215" y="30" class="value" text-anchor="end">18</text>

      <text x="0" y="60" class="label">◈ Stack Focus</text>
      <text x="215" y="60" class="value" text-anchor="end">CyberSec / UI</text>

      <text x="0" y="90" class="label">◈ Target Environment</text>
      <text x="215" y="90" class="value" text-anchor="end">Linux // KDE</text>

      <text x="0" y="120" class="label">◈ Current Status</text>
      <text x="215" y="120" class="value" text-anchor="end" fill="#9FA9DA">Building</text>
    </g>

    <!-- Right Rank / Core Dial -->
    <circle cx="335" cy="128" r="42" fill="none" stroke="#161b22" stroke-width="5" />
    <circle cx="335" cy="128" r="42" fill="none" stroke="#9FA9DA" stroke-width="4" stroke-dasharray="210 264" stroke-linecap="round" transform="rotate(-90 335 128)" filter="url(#softGlow)" />
    <circle cx="335" cy="128" r="50" fill="none" stroke="#8F96BF" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.4" class="glow-ring" />
    <text x="335" y="133" class="title" font-size="18" text-anchor="middle">S+</text>
    <text x="335" y="150" class="sub-text" text-anchor="middle">RANK</text>
  </g>

  <!-- ================= RIGHT CARD: LANGUAGE MATRIX ================= -->
  <g transform="translate(435, 10)">
    <rect class="bg-card" width="405" height="210" rx="10" />

    <!-- Cyber HUD Corners -->
    <path class="accent-corner" d="M 0 18 L 0 6 A 6 6 0 0 1 6 0 L 18 0" />
    <path class="accent-corner" d="M 387 0 L 399 0 A 6 6 0 0 1 405 6 L 405 18" />
    <path class="accent-corner" d="M 0 192 L 0 204 A 6 6 0 0 0 6 210 L 18 210" />
    <path class="accent-corner" d="M 387 210 L 399 210 A 6 6 0 0 0 405 204 L 405 192" />

    <!-- Card Header -->
    <circle cx="26" cy="28" r="4" fill="#9FA9DA" class="pulse" filter="url(#softGlow)" />
    <text x="40" y="32" class="title">LANGUAGE.MATRIX</text>
    <text x="335" y="31" class="sub-text">INDEX // 01</text>
    <line x1="20" y1="46" x2="385" y2="46" stroke="#9FA9DA" stroke-opacity="0.15" />

    <!-- Multi-Segment Overview Bar -->
    <g transform="translate(24, 62)">
      <rect x="0" y="0" width="160" height="7" fill="#9FA9DA" rx="2" />
      <rect x="164" y="0" width="82" height="7" fill="#7E8CE0" rx="2" />
      <rect x="250" y="0" width="58" height="7" fill="#6366F1" rx="2" />
      <rect x="312" y="0" width="45" height="7" fill="#4F46E5" rx="2" />
    </g>

    <!-- Language Breakdown Bars -->
    <g transform="translate(24, 95)">
      <!-- Python -->
      <text x="0" y="0" class="label">Python</text>
      <text x="357" y="0" class="value" text-anchor="end">46%</text>
      <rect x="0" y="7" width="357" height="5" class="bar-bg" />
      <rect x="0" y="7" width="164" height="5" fill="url(#langGrad)" rx="2.5">
        <animate attributeName="width" from="0" to="164" dur="1.2s" fill="freeze" />
      </rect>

      <!-- Kotlin / Java -->
      <text x="0" y="32" class="label">Kotlin / Java</text>
      <text x="357" y="32" class="value" text-anchor="end">24%</text>
      <rect x="0" y="39" width="357" height="5" class="bar-bg" />
      <rect x="0" y="39" width="86" height="5" fill="url(#langGrad)" rx="2.5">
        <animate attributeName="width" from="0" to="86" dur="1.2s" fill="freeze" />
      </rect>

      <!-- TypeScript / React -->
      <text x="0" y="64" class="label">TypeScript / React</text>
      <text x="357" y="64" class="value" text-anchor="end">18%</text>
      <rect x="0" y="71" width="357" height="5" class="bar-bg" />
      <rect x="0" y="71" width="64" height="5" fill="url(#langGrad)" rx="2.5">
        <animate attributeName="width" from="0" to="64" dur="1.2s" fill="freeze" />
      </rect>

      <!-- C / HTML / CSS -->
      <text x="0" y="96" class="label">C / HTML / CSS</text>
      <text x="357" y="96" class="value" text-anchor="end">12%</text>
      <rect x="0" y="103" width="357" height="5" class="bar-bg" />
      <rect x="0" y="103" width="43" height="5" fill="url(#langGrad)" rx="2.5">
        <animate attributeName="width" from="0" to="43" dur="1.2s" fill="freeze" />
      </rect>
    </g>
  </g>
</svg>
