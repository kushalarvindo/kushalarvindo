<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 165" width="100%" height="100%" font-family="&#39;Google Sans Flex&#39;, &#39;Google Sans&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif">
  <defs>
    <linearGradient id="comet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8F96BF" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#9FA9DA" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>
  <!-- LEFT: STATS -->
  <g transform="translate(30, 22)">
    <text x="0" y="0" fill="#9FA9DA" font-size="13" font-weight="600" letter-spacing="0.5">GitHub Stats</text>
    <g transform="translate(0, 30)" font-size="12.5">
      <text x="0" y="0" fill="#8F96BF">Total Commits</text>
      <text x="205" y="0" fill="#9FA9DA" font-weight="600" text-anchor="end">427</text>
      <text x="0" y="26" fill="#8F96BF">Pull Requests</text>
      <text x="205" y="26" fill="#9FA9DA" font-weight="600" text-anchor="end">14</text>
      <text x="0" y="52" fill="#8F96BF">Stars Earned</text>
      <text x="205" y="52" fill="#9FA9DA" font-weight="600" text-anchor="end">26</text>
      <text x="0" y="78" fill="#8F96BF">Repositories</text>
      <text x="205" y="78" fill="#9FA9DA" font-weight="600" text-anchor="end">18</text>
      <text x="0" y="104" fill="#8F96BF">Contributed To</text>
      <text x="205" y="104" fill="#9FA9DA" font-weight="600" text-anchor="end">12</text>
    </g>
    <!-- Drawn Rank Ring -->
    <g transform="translate(305, 70)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#8F96BF" stroke-opacity="0.12" stroke-width="2.5" />
      <circle cx="0" cy="0" r="34" fill="none" stroke="url(#comet)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" transform="rotate(-90)" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" from="213.6" to="48" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" />
      </circle>
      <text x="0" y="4" fill="#9FA9DA" font-size="20" font-weight="600" text-anchor="middle">A+</text>
      <text x="0" y="17" fill="#8F96BF" font-size="8" letter-spacing="1.5" opacity="0.6" text-anchor="middle">RANK</text>
    </g>
  </g>
  <!-- CENTER HAIRLINE DIVIDER (Draws Downward) -->
  <line x1="425" y1="18" x2="425" y2="18" stroke="#8F96BF" stroke-opacity="0.2" stroke-width="1">
    <animate attributeName="y2" from="18" to="150" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" />
  </line>

  <!-- RIGHT: LANGUAGES (Comet Progress) -->
  <g transform="translate(465, 22)">
    <text x="0" y="0" fill="#9FA9DA" font-size="13" font-weight="600" letter-spacing="0.5">Top Languages</text>
    <!-- Python -->
    <g transform="translate(0, 28)">
      <text x="0" y="0" fill="#8F96BF" font-size="12.5">Python</text>
      <text x="345" y="0" fill="#8F96BF" font-size="11" opacity="0.8" text-anchor="end">46.4%</text>
      <rect x="0" y="7" width="345" height="1.5" rx="0.75" fill="#8F96BF" fill-opacity="0.1" />
      <rect x="0" y="7" width="0" height="1.5" rx="0.75" fill="url(#comet)">
        <animate attributeName="width" from="0" to="160" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" />
      </rect>
      <circle cy="7.75" r="2" fill="#E2E8F0" filter="url(#glow)">
        <animate attributeName="cx" from="0" to="160" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" />
      </circle>
    </g>
    <!-- Kotlin -->
    <g transform="translate(0, 58)">
      <text x="0" y="0" fill="#8F96BF" font-size="12.5">Kotlin</text>
      <text x="345" y="0" fill="#8F96BF" font-size="11" opacity="0.8" text-anchor="end">24.1%</text>
      <rect x="0" y="7" width="345" height="1.5" rx="0.75" fill="#8F96BF" fill-opacity="0.1" />
      <rect x="0" y="7" width="0" height="1.5" rx="0.75" fill="url(#comet)">
        <animate attributeName="width" from="0" to="83" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" />
      </rect>
      <circle cy="7.75" r="1.8" fill="#E2E8F0" filter="url(#glow)">
        <animate attributeName="cx" from="0" to="83" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" />
      </circle>
    </g>
    <!-- TypeScript -->
    <g transform="translate(0, 88)">
      <text x="0" y="0" fill="#8F96BF" font-size="12.5">TypeScript</text>
      <text x="345" y="0" fill="#8F96BF" font-size="11" opacity="0.8" text-anchor="end">17.8%</text>
      <rect x="0" y="7" width="345" height="1.5" rx="0.75" fill="#8F96BF" fill-opacity="0.1" />
      <rect x="0" y="7" width="0" height="1.5" rx="0.75" fill="url(#comet)">
        <animate attributeName="width" from="0" to="61" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" />
      </rect>
      <circle cy="7.75" r="1.8" fill="#E2E8F0" filter="url(#glow)">
        <animate attributeName="cx" from="0" to="61" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" />
      </circle>
    </g>
    <!-- C / HTML / CSS -->
    <g transform="translate(0, 118)">
      <text x="0" y="0" fill="#8F96BF" font-size="12.5">C / HTML / CSS</text>
      <text x="345" y="0" fill="#8F96BF" font-size="11" opacity="0.8" text-anchor="end">11.7%</text>
      <rect x="0" y="7" width="345" height="1.5" rx="0.75" fill="#8F96BF" fill-opacity="0.1" />
      <rect x="0" y="7" width="0" height="1.5" rx="0.75" fill="url(#comet)">
        <animate attributeName="width" from="0" to="40" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" />
      </rect>
      <circle cy="7.75" r="1.8" fill="#E2E8F0" filter="url(#glow)">
        <animate attributeName="cx" from="0" to="40" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" />
      </circle>
    </g>
  </g>
</svg>
