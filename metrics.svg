<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 175" width="100%" height="100%">
  <defs>
    <style>
      .header {
        font-family: 'Fira Code', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #9FA9DA;
        letter-spacing: 0.8px;
      }
      .label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 400;
        fill: #8F96BF;
      }
      .val {
        font-family: 'Fira Code', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #9FA9DA;
      }
      .pct {
        font-family: 'Fira Code', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        font-size: 11.5px;
        font-weight: 400;
        fill: #8F96BF;
        opacity: 0.85;
      }
      .rank {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 22px;
        font-weight: 600;
        fill: #9FA9DA;
      }
      .rank-sub {
        font-family: 'Fira Code', monospace;
        font-size: 9px;
        fill: #8F96BF;
        letter-spacing: 1.5px;
        opacity: 0.7;
      }
      .divider {
        stroke: #8F96BF;
        stroke-opacity: 0.2;
        stroke-width: 1;
      }
      .track {
        fill: #8F96BF;
        fill-opacity: 0.12;
      }
      .bar {
        fill: #9FA9DA;
      }
      .ring-bg {
        fill: none;
        stroke: #8F96BF;
        stroke-opacity: 0.15;
        stroke-width: 3.5;
      }
      .ring-fg {
        fill: none;
        stroke: #9FA9DA;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-dasharray: 175 240;
      }
    </style>
  </defs>

  <!-- ================= LEFT: GITHUB STATS ================= -->
  <g transform="translate(25, 18)">
    <text x="0" y="0" class="header">GitHub Stats</text>

    <g transform="translate(0, 32)">
      <text x="0" y="0" class="label">Total Commits</text>
      <text x="215" y="0" class="val" text-anchor="end">427</text>

      <text x="0" y="28" class="label">Total Pull Requests</text>
      <text x="215" y="28" class="val" text-anchor="end">14</text>

      <text x="0" y="56" class="label">Total Stars Earned</text>
      <text x="215" y="56" class="val" text-anchor="end">26</text>

      <text x="0" y="84" class="label">Public Repositories</text>
      <text x="215" y="84" class="val" text-anchor="end">18</text>

      <text x="0" y="112" class="label">Contributed To</text>
      <text x="215" y="112" class="val" text-anchor="end">12</text>
    </g>

    <!-- Minimal Rank Ring (matches Streak ring style) -->
    <g transform="translate(315, 74)">
      <circle cx="0" cy="0" r="36" class="ring-bg" />
      <circle cx="0" cy="0" r="36" class="ring-fg" transform="rotate(-90)" />
      <text x="0" y="4" class="rank" text-anchor="middle">A+</text>
      <text x="0" y="18" class="rank-sub" text-anchor="middle">RANK</text>
    </g>
  </g>

  <!-- ================= CENTER VERTICAL DIVIDER ================= -->
  <line x1="425" y1="15" x2="425" y2="160" class="divider" />

  <!-- ================= RIGHT: TOP LANGUAGES ================= -->
  <g transform="translate(465, 18)">
    <text x="0" y="0" class="header">Most Used Languages</text>

    <!-- Python -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" class="label">Python</text>
      <text x="355" y="0" class="pct" text-anchor="end">46.4%</text>
      <rect x="0" y="8" width="355" height="2.5" rx="1.25" class="track" />
      <rect x="0" y="8" width="165" height="2.5" rx="1.25" class="bar" opacity="0.95" />
    </g>

    <!-- Kotlin -->
    <g transform="translate(0, 62)">
      <text x="0" y="0" class="label">Kotlin</text>
      <text x="355" y="0" class="pct" text-anchor="end">24.1%</text>
      <rect x="0" y="8" width="355" height="2.5" rx="1.25" class="track" />
      <rect x="0" y="8" width="86" height="2.5" rx="1.25" class="bar" opacity="0.8" />
    </g>

    <!-- TypeScript -->
    <g transform="translate(0, 94)">
      <text x="0" y="0" class="label">TypeScript</text>
      <text x="355" y="0" class="pct" text-anchor="end">17.8%</text>
      <rect x="0" y="8" width="355" height="2.5" rx="1.25" class="track" />
      <rect x="0" y="8" width="63" height="2.5" rx="1.25" class="bar" opacity="0.65" />
    </g>

    <!-- C / HTML / CSS -->
    <g transform="translate(0, 126)">
      <text x="0" y="0" class="label">C / HTML / CSS</text>
      <text x="355" y="0" class="pct" text-anchor="end">11.7%</text>
      <rect x="0" y="8" width="355" height="2.5" rx="1.25" class="track" />
      <rect x="0" y="8" width="41" height="2.5" rx="1.25" class="bar" opacity="0.5" />
    </g>
  </g>
</svg>
