<svg width="100%" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="meteor" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="10%" stop-color="#9FA9DA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9FA9DA" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g fill="#9FA9DA">
    <circle cx="120" cy="30" r="1"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="80" r="0.8"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="110" r="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="15" r="1.5"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="rotate(18)">
    
    <g opacity="0.4">
      <animateTransform attributeName="transform" type="translate" from="-100, -50" to="900, -50" dur="7s" repeatCount="indefinite" />
      <line x1="0" y1="0" x2="120" y2="0" stroke="url(#meteor)" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <g filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" from="-200, 20" to="1000, 20" dur="4s" begin="1.5s" repeatCount="indefinite" />
      <line x1="0" y1="0" x2="200" y2="0" stroke="url(#meteor)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <g opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="-150, 90" to="950, 90" dur="3s" begin="3s" repeatCount="indefinite" />
      <line x1="0" y1="0" x2="140" y2="0" stroke="url(#meteor)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
  </g>
</svg>
