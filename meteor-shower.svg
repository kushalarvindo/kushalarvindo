<svg width="100%" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="meteor" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="5%" stop-color="#9FA9DA" stop-opacity="1" />
      <stop offset="100%" stop-color="#9FA9DA" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g fill="#9FA9DA">
    <circle cx="120" cy="30" r="1.5"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="80" r="1"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="110" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="15" r="2"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="rotate(15)">
    
    <g opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="-300, -20" to="1000, -20" dur="8s" repeatCount="indefinite" />
      <line x1="0" y1="0" x2="120" y2="0.1" stroke="url(#meteor)" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" from="-700, 30" to="1100, 30" dur="6s" repeatCount="indefinite" />
      <line x1="0" y1="0" x2="200" y2="0.1" stroke="url(#meteor)" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="200" y2="0.1" stroke="url(#meteor)" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g opacity="0.7">
      <animateTransform attributeName="transform" type="translate" from="-1200, 100" to="1000, 100" dur="5s" repeatCount="indefinite" />
      <line x1="0" y1="0" x2="140" y2="0.1" stroke="url(#meteor)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
  </g>
</svg>
