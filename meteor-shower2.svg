<svg width="100%" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ambient Neon Blur Filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="tight-glow"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="diffuse-glow"/>
      <feMerge>
        <feMergeNode in="diffuse-glow"/>
        <feMergeNode in="tight-glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star Twinkle Filter -->
    <filter id="star-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="starBlur"/>
      <feMerge>
        <feMergeNode in="starBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="meteor" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="12%" stop-color="#9FA9DA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9FA9DA" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Glowing Twinkling Constellations -->
  <g fill="#9FA9DA" filter="url(#star-glow)">
    <circle cx="120" cy="30" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="80" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="110" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="15" r="2.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="45" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="95" r="1.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Glowing Meteors -->
  <g transform="rotate(15)">
    <!-- Trail 1 -->
    <g opacity="0.6" filter="url(#neon-glow)">
      <animateTransform attributeName="transform" type="translate" from="0, -20" to="1500, -20" dur="8s" repeatCount="indefinite" />
      <line x1="-500" y1="0" x2="-380" y2="0.1" stroke="url(#meteor)" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Trail 2 (Main Comet) -->
    <g filter="url(#neon-glow)">
      <animateTransform attributeName="transform" type="translate" from="0, 30" to="2000, 30" dur="6s" repeatCount="indefinite" />
      <line x1="-700" y1="0" x2="-500" y2="0.1" stroke="url(#meteor)" stroke-width="5" opacity="0.3" stroke-linecap="round"/>
      <line x1="-700" y1="0" x2="-500" y2="0.1" stroke="url(#meteor)" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Trail 3 -->
    <g opacity="0.75" filter="url(#neon-glow)">
      <animateTransform attributeName="transform" type="translate" from="0, 100" to="2000, 100" dur="5s" repeatCount="indefinite" />
      <line x1="-1200" y1="0" x2="-1060" y2="0.1" stroke="url(#meteor)" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
