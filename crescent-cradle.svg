<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft starlight glow -->
    <linearGradient id="cradleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#9FA9DA" />
      <stop offset="100%" stop-color="#3c4475" />
    </linearGradient>
  </defs>

  <!-- Pendulum Inertia: Rotates with natural ease-in-out deceleration at peaks -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="-10 50 50; 10 50 50; -10 50 50" 
      dur="3.8s" 
      repeatCount="indefinite"
      calcMode="spline" 
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" 
      keyTimes="0; 0.5; 1" />

    <!-- Crescent Moon Cradle -->
    <path d="M 22,46 C 24,72 46,78 68,68 C 50,74 32,68 28,46 C 26,38 23,41 22,46 Z" 
          fill="url(#cradleGrad)" />

    <!-- Resting Star Inside the Curve -->
    <g transform="translate(48, 54)">
      <!-- Star Counter-Balancing Tilt -->
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="6 0 0; -6 0 0; 6 0 0" 
        dur="3.8s" 
        repeatCount="indefinite"
        calcMode="spline" 
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" 
        keyTimes="0; 0.5; 1" />

      <!-- Cute 4-Point Star Body -->
      <path d="M 0,-7 Q 0,0 -7,0 Q 0,0 0,7 Q 0,0 7,0 Q 0,0 0,-7 Z" fill="#ffffff">
        <animate attributeName="opacity" values="0.75; 1; 0.75" dur="1.9s" repeatCount="indefinite" />
      </path>

      <!-- Center Star Hearth -->
      <circle cx="0" cy="0" r="1.5" fill="#9FA9DA" />
    </g>

    <!-- Tiny Dream Sparkle (Sleepy Spark) -->
    <circle cx="66" cy="38" r="1" fill="#9FA9DA">
      <animate attributeName="opacity" values="0.1; 0.9; 0.1" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="0.8; 1.6; 0.8" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
