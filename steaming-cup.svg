<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="steamFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9FA9DA" stop-opacity="0" />
      <stop offset="40%" stop-color="#9FA9DA" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Saucer -->
  <line x1="30" y1="84" x2="68" y2="84" stroke="#3c4475" stroke-width="1.6" stroke-linecap="round" />

  <!-- Mug Outline -->
  <g stroke="#9FA9DA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <path d="M 35,52 L 37,73 C 38,79 43,81 50,81 C 57,81 61,79 62,73 L 64,52 Z" />
    <!-- Handle -->
    <path d="M 63,57 C 72,57 71,70 61,70" />
  </g>

  <!-- Steam Wisp 1 (Weaving Left) -->
  <path fill="none" stroke="url(#steamFade)" stroke-width="1.4" stroke-linecap="round"
        d="M 44,48 C 40,38 48,32 43,20 C 40,12 46,8 44,4">
    <animate attributeName="stroke-dasharray" values="2,40; 25,15; 2,40" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="stroke-dashoffset" values="40; 0; -40" dur="3.2s" repeatCount="indefinite" />
  </path>

  <!-- Steam Wisp 2 (Weaving Right) -->
  <path fill="none" stroke="url(#steamFade)" stroke-width="1.4" stroke-linecap="round"
        d="M 54,48 C 58,37 50,30 55,18 C 58,11 52,6 54,2">
    <animate attributeName="stroke-dasharray" values="2,40; 25,15; 2,40" dur="2.8s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="stroke-dashoffset" values="40; 0; -40" dur="2.8s" begin="0.5s" repeatCount="indefinite" />
  </path>

  <!-- Tiny Rising Star Sparkle -->
  <g transform="translate(48, 14)">
    <animateTransform attributeName="transform" type="translate" values="48,22; 48,8; 48,0" dur="3s" repeatCount="indefinite" />
    <circle cx="0" cy="0" r="1.2" fill="#ffffff">
      <animate attributeName="opacity" values="0; 0.9; 0" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
