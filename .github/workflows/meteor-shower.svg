<svg width="100%" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- The glowing comet tail gradient -->
    <linearGradient id="tail" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9FA9DA" stop-opacity="0" />
      <stop offset="80%" stop-color="#9FA9DA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    
    <!-- The head glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep background comet (Slow) -->
  <g opacity="0.4">
    <animateTransform attributeName="transform" type="translate" from="850, -50" to="-100, 200" dur="8s" repeatCount="indefinite" />
    <line x1="0" y1="0" x2="60" y2="-60" stroke="url(#tail)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Main foreground comet (Fast and Bright) -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" from="900, -20" to="-50, 250" dur="4.5s" repeatCount="indefinite" />
    <line x1="0" y1="0" x2="120" y2="-120" stroke="url(#tail)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Small delayed comet (Medium) -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" from="1100, -100" to="-100, 300" dur="6s" repeatCount="indefinite" />
    <line x1="0" y1="0" x2="80" y2="-80" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>
</svg>
