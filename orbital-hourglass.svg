<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FA9DA" />
      <stop offset="100%" stop-color="#3c4475" />
    </linearGradient>
  </defs>

  <!-- Master Rotator: Flips 180 deg once pearls accumulate -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 50 50; 0 50 50; 180 50 50; 180 50 50" 
      keyTimes="0; 0.65; 0.85; 1" 
      dur="4.5s" 
      repeatCount="indefinite"
      calcMode="spline" 
      keySplines="0 0 1 1; 0.65 0 0.35 1; 0 0 1 1" />

    <!-- Top Cap & Base Plate -->
    <line x1="36" y1="26" x2="64" y2="26" stroke="#9FA9DA" stroke-width="2" stroke-linecap="round" />
    <line x1="36" y1="74" x2="64" y2="74" stroke="#9FA9DA" stroke-width="2" stroke-linecap="round" />

    <!-- Elegant Hourglass Contour -->
    <path d="M 38,28 C 38,42 47,47 48,50 C 47,53 38,58 38,72 
             M 62,28 C 62,42 53,47 52,50 C 53,53 62,58 62,72" 
          fill="none" stroke="url(#glassGrad)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Falling Pearl 1 -->
    <circle cx="50" cy="38" r="2" fill="#ffffff">
      <animate attributeName="cy" values="38; 49; 68" 
               keyTimes="0; 0.25; 0.5" 
               dur="4.5s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.4 0 0.8 0.5; 0.2 0 0.6 1" />
      <animate attributeName="opacity" values="1; 1; 0.9; 0" keyTimes="0; 0.48; 0.65; 0.68" dur="4.5s" repeatCount="indefinite" />
    </circle>

    <!-- Falling Pearl 2 -->
    <circle cx="50" cy="38" r="2" fill="#9FA9DA">
      <animate attributeName="cy" values="38; 49; 65" 
               begin="0.7s" keyTimes="0; 0.25; 0.5" 
               dur="4.5s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.4 0 0.8 0.5; 0.2 0 0.6 1" />
      <animate attributeName="opacity" values="1; 1; 0.9; 0" keyTimes="0; 0.48; 0.65; 0.68" begin="0.7s" dur="4.5s" repeatCount="indefinite" />
    </circle>

    <!-- Falling Pearl 3 -->
    <circle cx="50" cy="38" r="1.8" fill="#ffffff">
      <animate attributeName="cy" values="38; 49; 62" 
               begin="1.4s" keyTimes="0; 0.25; 0.5" 
               dur="4.5s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.4 0 0.8 0.5; 0.2 0 0.6 1" />
      <animate attributeName="opacity" values="1; 1; 0.9; 0" keyTimes="0; 0.48; 0.65; 0.68" begin="1.4s" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
